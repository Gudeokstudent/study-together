<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Together</title>
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#242333;--muted:#77768a;--line:#e5e5ef;--primary:#705be7;--soft:#eeebff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Pretendard,sans-serif}.dark{--bg:#171722;--card:#252534;--text:#f5f4ff;--muted:#aaa8bb;--line:#3b3a4d;--soft:#35314d}.wrap{max-width:980px;margin:auto;padding:24px 16px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:24px;font-weight:800}.logo b{color:var(--primary)}.user{display:flex;align-items:center;gap:8px}.avatar{background:#ffd9c4;border-radius:50%;padding:9px}.card{background:var(--card);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 24px #392d7410}.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,#e9e6ff,var(--card))}h1{font-size:25px;margin:8px 0}h2{font-size:18px;margin:0 0 14px}h3{font-size:15px;margin:0 0 14px}p,small{color:var(--muted);font-size:13px}.timer{font-size:34px;font-weight:800;color:var(--primary);margin-bottom:10px;font-variant-numeric:tabular-nums}.primary,.secondary{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:var(--primary);color:#fff}.secondary{background:var(--soft);color:var(--primary)}.input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap}.friends{display:grid;gap:10px}.friend{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 0}.friend .name{flex:1}.online{width:8px;height:8px;background:#42d294;border-radius:50%}.empty{text-align:center;color:var(--muted);padding:18px}.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--primary)}.goalLine{display:flex;align-items:center;gap:18px}.circle{width:95px;height:95px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--primary) 0 0%,var(--line) 0)}.circle div{background:var(--card);width:75px;height:75px;border-radius:50%;display:grid;place-items:center;font-weight:800}.modal{position:fixed;inset:0;background:#11112299;display:grid;place-items:center;padding:20px;z-index:5}.modalBox{background:var(--card);padding:24px;border-radius:18px;width:min(420px,100%)}.modalBox>*{margin-top:10px}.hidden{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29273c;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:9}@media(max-width:700px){.hero{display:block}.grid{grid-template-columns:1fr}.full{grid-column:auto}.timer{text-align:left}}
</style></head><body>
<div id="loginModal" class="modal"><div class="modalBox"><h2>Study Together 시작하기</h2><p>친구들에게 표시할 프로필 이름을 입력해주세요.</p><input class="input" id="loginName" placeholder="프로필 이름"><button class="primary" id="loginBtn">로그인</button></div></div>
<div class="wrap"><header class="top"><div class="logo">Study <b>Together</b></div><div class="user"><span class="avatar">🙂</span><span><strong id="userName">게스트</strong><br><small id="loginState">로그인 필요</small></span><button class="secondary" id="themeBtn">다크 모드</button><button class="secondary" id="logoutBtn">로그아웃</button></div></header>
<section class="card hero"><div><p style="color:var(--primary);font-weight:bold">TODAY'S FOCUS</p><h1 id="greeting">오늘도 함께 공부해요</h1><p>공부 시간을 기록하고 친구들과 공유해보세요.</p></div><div><div class="timer" id="timer">00:00:00</div><button class="primary" id="timerBtn">공부 시작하기</button></div></section>
<div class="grid"><section class="card"><div class="row"><h3>나의 목표</h3><button class="secondary" id="goalBtn">목표 수정</button></div><div class="goalLine"><div class="circle" id="circle"><div id="percent">0%</div></div><div style="flex:1"><strong id="goalText"></strong><p id="goalDesc"></p><div class="bar"><span id="goalBar"></span></div></div></div><div id="goalForm" class="actions hidden"><input class="input" id="goalInput" type="number" min="1" max="24" placeholder="목표 시간(시간)"><button class="primary" id="saveGoal">저장</button></div></section>
<section class="card"><div class="row"><h3 id="roomTitle">공부방</h3><button class="secondary" id="leaveBtn">방 나가기</button></div><p>같은 방에 들어온 친구들의 공부 시간이 실시간으로 표시됩니다.</p><div id="friends" class="friends"></div></section>
<section class="card full"><h2>공부방 만들기 / 입장</h2><div class="grid"><div><h3>새 방 만들기</h3><input class="input" id="newRoom" placeholder="방 이름"><input class="input" id="newPass" type="password" placeholder="방 비밀번호"><button class="primary" id="createBtn">방 만들기</button></div><div><h3>기존 방 입장</h3><input class="input" id="joinRoom" placeholder="방 이름"><input class="input" id="joinPass" type="password" placeholder="방 비밀번호"><button class="primary" id="joinBtn">입장하기</button></div></div><p>방 이름과 비밀번호를 친구에게 알려주면 친구도 같은 방에 참여할 수 있습니다.</p></section>
<section class="card full"><h3>프로필 이름 변경</h3><div class="row"><input class="input" id="nameInput"><button class="primary" id="saveName">저장</button></div></section></div></div><div class="toast" id="toast"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInAnonymously,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,getDoc,collection,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDyo_qo4bGYSVxQ9fX48fdbIZ07pYdqOt4',authDomain:'study-together-d8360.firebaseapp.com',projectId:'study-together-d8360',storageBucket:'study-together-d8360.firebasestorage.app',messagingSenderId:'1035308454110',appId:'1:1035308454110:web:84f03e6a8d7bb6185fb24f'};const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);const $=id=>document.getElementById(id);let uid='',profile=localStorage.getItem('profileName')||'',room=localStorage.getItem('currentRoom')||'',running=false,iv,unsub=null,data={seconds:0,goal:14400};
function fmt(s){return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function hash(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''))}function ensure(){if(!profile){$('loginModal').classList.remove('hidden');return false}if(!room){toast('먼저 공부방을 만들거나 입장해주세요');return false}return true}
async function render(){if(!uid)return;$('userName').textContent=profile||'게스트';$('nameInput').value=profile;$('roomTitle').textContent=room?room+' 공부방':'공부방';$('timer').textContent=fmt(data.seconds);let pct=Math.min(100,Math.round(data.seconds/data.goal*100));$('percent').textContent=pct+'%';$('circle').style.background=`conic-gradient(var(--primary) 0 ${pct}%,var(--line) ${pct}% 100%)`;$('goalBar').style.width=pct+'%';$('goalText').textContent=`오늘 ${Math.round(data.goal/3600)}시간 공부하기`;$('goalDesc').textContent=pct>=100?'오늘 목표를 달성했어요!':`${fmt(Math.max(0,data.goal-data.seconds))} 더 공부하면 목표 달성!`}
async function enter(r){room=r;localStorage.setItem('currentRoom',r);if(unsub)unsub();unsub=onSnapshot(collection(db,'rooms',room,'members'),s=>{$('friends').innerHTML=s.empty?'<div class="empty">아직 참여한 친구가 없습니다.</div>':s.docs.map(x=>{let d=x.data();return`<div class="friend"><span>🙂</span><span class="name">${String(d.name||'이름 없음').replace(/[<>&]/g,'')}<small>${d.online?'공부 중':'공부 기록'}</small></span>${d.online?'<i class="online"></i>':''}<b>${fmt(d.seconds||0)}</b></div>`}).join('')});let me=await getDoc(doc(db,'rooms',room,'members',uid));data=me.exists()?{seconds:me.data().seconds||0,goal:me.data().goal||14400}:{seconds:0,goal:14400};await render()}
async function member(){if(room&&uid)await setDoc(doc(db,'rooms',room,'members',uid),{name:profile,seconds:data.seconds,goal:data.goal,online:running,updatedAt:serverTimestamp()},{merge:true})}
onAuthStateChanged(auth,u=>{if(u){uid=u.uid;render();if(room)enter(room)}});signInAnonymously(auth).catch(()=>toast('Firebase 로그인에 실패했습니다.'));if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
$('loginBtn').onclick=()=>{let n=$('loginName').value.trim();if(!n)return toast('프로필 이름을 입력해주세요');profile=n;localStorage.setItem('profileName',n);$('loginModal').classList.add('hidden');member();render()};$('logoutBtn').onclick=()=>{profile='';localStorage.removeItem('profileName');$('loginModal').classList.remove('hidden')};$('themeBtn').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')};$('timerBtn').onclick=()=>{if(!ensure())return;running=!running;$('timerBtn').textContent=running?'공부 일시정지':'공부 시작하기';member();if(running)iv=setInterval(()=>{data.seconds++;member();render()},1000);else{clearInterval(iv);member();render();toast('공부 시간이 저장됐습니다')}};$('goalBtn').onclick=()=>{$('goalInput').value=data.goal/3600;$('goalForm').classList.remove('hidden')};$('saveGoal').onclick=()=>{let n=Number($('goalInput').value);if(n<1||n>24)return toast('1~24시간으로 입력해주세요');data.goal=n*3600;$('goalForm').classList.add('hidden');member();render();toast('목표가 수정됐습니다')};$('saveName').onclick=()=>{let n=$('nameInput').value.trim();if(!n)return toast('이름을 입력해주세요');profile=n;localStorage.setItem('profileName',n);member();render();toast('프로필이 저장됐습니다')};$('createBtn').onclick=async()=>{if(!profile)return $('loginModal').classList.remove('hidden');let r=$('newRoom').value.trim(),p=$('newPass').value;if(!r||!p)return toast('방 이름과 비밀번호를 입력해주세요');let h=await hash(p),ref=doc(db,'rooms',r);if((await getDoc(ref)).exists())return toast('이미 있는 방입니다');await setDoc(ref,{name:r,passwordHash:h,createdAt:serverTimestamp()});await enter(r);toast('공부방을 만들었습니다')};$('joinBtn').onclick=async()=>{if(!profile)return $('loginModal').classList.remove('hidden');let r=$('joinRoom').value.trim(),p=$('joinPass').value,s=await getDoc(doc(db,'rooms',r));if(!s.exists()||s.data().passwordHash!==await hash(p))return toast('방 이름 또는 비밀번호가 맞지 않습니다');await enter(r);toast('공부방에 입장했습니다')};$('leaveBtn').onclick=()=>{running=false;clearInterval(iv);member();room='';localStorage.removeItem('currentRoom');if(unsub)unsub();$('friends').innerHTML='';render();toast('공부방에서 나왔습니다')};if(!profile)$('loginModal').classList.remove('hidden');
</script></body></html>

<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>모여공부</title>
<style>
:root{--p:#7562e8;--dark:#242333;--bg:#f7f7fb;--line:#e9e8f0;--muted:#858493}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,Pretendard,sans-serif;color:var(--dark)}button,input{font:inherit}button{cursor:pointer;border:0}.wrap{max-width:1060px;margin:auto;padding:28px 22px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.logo{font-size:24px;font-weight:800}.logo b{color:var(--p)}.user{display:flex;align-items:center;gap:10px}.avatar{background:#ffe1cf;border-radius:50%;padding:10px}.card{background:#fff;border-radius:20px;padding:22px;box-shadow:0 8px 28px #392d7410;margin-bottom:18px}.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(110deg,#eae7ff,#faf8ff)}h1{font-size:25px;margin:7px 0}h2{font-size:19px;margin:0 0 8px}h3{font-size:15px;margin:0 0 17px}p{color:var(--muted);font-size:13px}.timer{font-size:34px;font-weight:800;color:#5d4ed0;text-align:right;margin-bottom:10px;font-variant-numeric:tabular-nums}.primary{background:var(--p);color:#fff;border-radius:11px;padding:12px 16px;font-weight:700}.secondary{background:#f0effb;color:#5e50c7;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.input{border:1px solid var(--line);border-radius:9px;padding:10px;width:100%;font-size:13px}.bar{height:9px;background:#ededf4;border-radius:9px;overflow:hidden}.bar span{height:100%;display:block;background:var(--p)}.goal{display:flex;align-items:center;gap:22px}.circle{width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--p) 0 67%,#ededf4 67%);display:grid;place-items:center;flex:none}.circle:after{content:"";position:absolute;width:84px;height:84px;border-radius:50%;background:#fff}.circle div{position:relative;z-index:1;text-align:center}.circle strong{display:block;font-size:22px}.friends{display:grid;gap:11px}.friend{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px}.friend:last-child{border:0}.friend .face{font-size:21px}.friend .name{flex:1;font-size:13px}.friend small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.friend time{font-size:12px;font-weight:700}.online{width:7px;height:7px;background:#4bd596;border-radius:50%}.empty{text-align:center;color:var(--muted);font-size:13px;padding:12px 0}.chart{display:flex;align-items:end;justify-content:space-around;height:150px;border-bottom:1px solid var(--line);padding-top:15px}.day{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:8px;color:var(--muted);font-size:11px}.barcol{width:26px;background:#dedafb;border-radius:7px 7px 0 0}.barcol.today{background:var(--p)}.actions{display:flex;gap:8px;margin-top:15px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;background:#29273c;color:white;padding:12px 17px;border-radius:10px;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.wrap{padding:18px 14px}.hero{display:block}.timer{text-align:left;margin-top:18px}.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{margin-bottom:18px}.user small{display:none}}
</style></head><body><div class="wrap"><header class="top"><div class="logo">모여<b>공부</b></div><div class="user"><span class="avatar">🙂</span><span><strong id="userName">내 공부방</strong><small style="display:block;color:#888">내 계정</small></span></div></header>
<section class="card hero"><div><p style="color:#7562e8;font-weight:bold">TODAY'S FOCUS</p><h1 id="greeting">오늘도 집중해볼까요?</h1><p>내 공부시간을 기록하고 친구들과 공유해보세요.</p></div><div><div class="timer" id="timer">00:00:00</div><button class="primary" id="timerBtn">공부 시작하기</button></div></section>
<div class="grid"><section class="card"><div class="row"><h3>나의 목표</h3><button class="secondary" id="goalBtn">목표 수정</button></div><div class="goal"><div class="circle"><div><strong id="percent">0%</strong><small>달성률</small></div></div><div style="flex:1"><strong id="goalText">오늘 4시간 공부하기</strong><p id="goalDesc">공부시간을 기록하면 달성률이 자동으로 계산돼요.</p><div class="bar"><span id="goalBar" style="width:0%"></span></div></div></div><div id="goalForm" style="display:none;margin-top:16px"><div class="row"><input class="input" id="goalInput" type="number" min="1" max="24" placeholder="목표 시간(시간)"><button class="primary" id="saveGoal">저장</button></div></div></section>
<section class="card"><div class="row"><h3 id="roomTitle">공부방</h3><button class="secondary" id="leaveBtn">방 나가기</button></div><p>같은 방 코드로 입장한 사람들의 공부시간이 여기에 표시됩니다.</p><div id="friends" class="friends"></div></section>
<section class="card full"><div class="row"><h3>이번 주 기록</h3><button class="secondary" id="resetBtn">기록 초기화</button></div><div class="chart" id="chart"></div></section>
<section class="card full"><h3>공부방 입장</h3><div class="row"><input class="input" id="roomInput" placeholder="방 이름 또는 방 코드"><button class="primary" id="joinBtn">입장하기</button></div><p>친구들에게 같은 방 이름을 알려주세요. 현재 버전은 브라우저에 방별 데이터를 저장하며, 서로 다른 기기 간 공유에는 온라인 데이터베이스 연결이 필요합니다.</p><h3 style="margin-top:18px">내 프로필</h3><div class="row"><input class="input" id="nameInput" placeholder="닉네임을 입력하세요"><button class="primary" id="saveName">저장</button></div></section></div></div><div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);let room=localStorage.getItem('currentRoom')||'내 공부방';let key='moeugongbu-room-'+room;let data=JSON.parse(localStorage.getItem(key)||'null')||{name:'내 이름',goal:14400,seconds:0,week:[0,0,0,0,0,0,0],members:[]};let running=false,iv;
function save(){localStorage.setItem(key,JSON.stringify(data))}function fmt(s){return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
function render(){ $('userName').textContent=data.name;$('nameInput').value=data.name;$('roomInput').value=room;$('roomTitle').textContent=room+' 공부방';$('timer').textContent=fmt(data.seconds);let pct=Math.min(100,Math.round(data.seconds/data.goal*100));$('percent').textContent=pct+'%';$('goalBar').style.width=pct+'%';$('goalText').textContent=`오늘 ${Math.round(data.goal/3600)}시간 공부하기`;$('goalDesc').textContent=pct>=100?'오늘의 목표를 달성했어요! 🎉':`${fmt(Math.max(0,data.goal-data.seconds))} 더 공부하면 목표를 달성해요.`;$('friends').innerHTML=data.members.length?data.members.map((f,i)=>`<div class="friend"><span class="face">${['🙂','😎','🐻','🐱','🦊'][i%5]}</span><span class="name">${esc(f.name)}<small>${f.seconds?'오늘 '+fmt(f.seconds):'아직 공부시간 없음'}</small></span><span class="${f.online?'online':''}"></span><time>${fmt(f.seconds||0)}</time></div>`).join(''):'<div class="empty">아직 이 방에 참여한 사람이 없어요.<br>내 프로필을 저장하고 공부를 시작해보세요.</div>'; $('chart').innerHTML=data.week.map((v,i)=>`<div class="day"><div class="barcol ${i===6?'today':''}" style="height:${Math.max(5,Math.min(115,v/180))}px"></div>${['월','화','수','목','금','토','일'][i]}</div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function syncMe(){let me=data.members.find(x=>x.name===data.name);if(me){me.seconds=data.seconds;me.online=running}}
$('timerBtn').onclick=()=>{running=!running;if(running){$('timerBtn').textContent='공부 일시정지';$('greeting').textContent='집중 모드로 공부 중이에요 🔥';syncMe();iv=setInterval(()=>{data.seconds++;data.week[6]++;syncMe();save();render()},1000)}else{clearInterval(iv);syncMe();save();$('timerBtn').textContent='공부 다시 시작';$('greeting').textContent='잠깐 쉬어도 괜찮아요';toast('공부시간을 저장했어요')}};
$('saveName').onclick=()=>{let n=$('nameInput').value.trim();if(!n)return toast('닉네임을 입력해주세요');data.name=n;let me=data.members.find(x=>x.id===n);if(!me)data.members.push({id:n,name:n,seconds:data.seconds,online:false});else me.name=n;save();render();toast('프로필을 저장했어요')};$('goalBtn').onclick=()=>{$('goalInput').value=Math.round(data.goal/3600);$('goalForm').style.display='block';$('goalInput').focus()};$('saveGoal').onclick=()=>{let n=Number($('goalInput').value);if(!n||n<1||n>24)return toast('1~24시간 사이로 입력해주세요');data.goal=n*3600;save();render();$('goalForm').style.display='none';toast('목표를 수정했어요')};$('joinBtn').onclick=()=>{let r=$('roomInput').value.trim();if(!r)return toast('방 이름을 입력해주세요');room=r;localStorage.setItem('currentRoom',room);key='moeugongbu-room-'+room;data=JSON.parse(localStorage.getItem(key)||'null')||{name:data.name||'내 이름',goal:14400,seconds:0,week:[0,0,0,0,0,0,0],members:[]};save();render();toast(room+' 공부방에 입장했어요')};$('leaveBtn').onclick=()=>{room='내 공부방';localStorage.setItem('currentRoom',room);key='moeugongbu-room-'+room;data=JSON.parse(localStorage.getItem(key)||'null')||{name:'내 이름',goal:14400,seconds:0,week:[0,0,0,0,0,0,0],members:[]};render();toast('내 공부방으로 돌아왔어요')};$('resetBtn').onclick=()=>{if(confirm('이번 주 기록을 초기화할까요?')){data.week=[0,0,0,0,0,0,0];save();render();toast('주간 기록을 초기화했어요')}};render();
</script></body></html>
